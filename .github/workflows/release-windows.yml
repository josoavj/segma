name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag à publier, par exemple v1.0.0'
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: segma
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  windows:
    name: Build Windows (zip + installateur .exe)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+([.-][A-Za-z0-9.-]+)?$') { throw "Tag invalide: $tag" }
          $v = $tag.Substring(1)
          $num = if ($v -match '^\d+\.\d+\.\d+') { $Matches[0] } else { '0.0.0' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NUMERIC_VERSION=$num" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Nettoyage Flutter et activation du Windows-desktop
        run: |
          flutter config --enable-windows-desktop
          flutter clean

      - name: Icônes (assets/logo/main.png)
        run: |
          python -m pip install pillow
          $iconDir = Join-Path $env:RUNNER_TEMP 'segma-icons'
          python packaging/make_icons.py assets/logo/main.png $iconDir
          # L'exécutable Flutter embarque directement le logo
          New-Item -ItemType Directory -Force windows/runner/resources | Out-Null
          Copy-Item (Join-Path $iconDir 'segma.ico') windows/runner/resources/app_icon.ico -Force

      - name: Flutter build Windows
        run: |
          flutter pub get
          flutter build windows --release --build-name=$env:VERSION --build-number=$env:NUMERIC_VERSION -v
          if ($LASTEXITCODE -ne 0) { throw "Flutter build Windows a échoué (code $LASTEXITCODE)" }

      - name: Assemblage + zip portable
        run: |
          $name  = "segma-$env:VERSION-windows-x64"
          $stage = "build/stage/$name"
          New-Item -ItemType Directory -Force "$stage/app", "dist" | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" "$stage/app/"
          Copy-Item -Recurse -Force backend "$stage/backend"
          Get-ChildItem "$stage/backend" -Recurse -Force -Directory |
            Where-Object { $_.Name -in '__pycache__', '.venv', '.idea', 'data' } | Remove-Item -Recurse -Force
          Get-ChildItem "$stage/backend" -Recurse -Force -File |
            Where-Object { $_.Name -eq '.env' -or $_.Extension -eq '.pyc' } | Remove-Item -Force
          Copy-Item -Path packaging/windows/segma.ps1, packaging/windows/segma.bat, .env.example, LICENSE -Destination $stage -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'segma-icons/segma.ico') "$stage/segma.ico" -Force
          "STAGE=$((Resolve-Path $stage).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"

      - name: Installateur Inno Setup (.exe)
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
          }
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not $iscc -or -not (Test-Path $iscc)) { throw "ISCC.exe introuvable" }
          & $iscc "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:NUMERIC_VERSION" `
                  "/DStageDir=$env:STAGE" "/DOutDir=$((Resolve-Path dist).Path)" packaging/windows/segma.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué" }

      - name: Checksums
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -notlike 'SHA256*' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: segma-windows
          path: dist/*
          if-no-files-found: error

      - name: Publier sur la release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; [[ "$RELEASE_TAG" == *-* ]] && PRE="--prerelease"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes $PRE ||
              gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
