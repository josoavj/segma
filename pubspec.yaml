name: segma
description: "Image segmentation platform using SAM3"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # UI & State Management
  flutter_riverpod: ^3.2.1

  # File & Image handling
  path: ^1.9.0
  path_provider: ^2.1.1
  image: ^4.1.3

  # API & Network
  dio: ^5.3.1
  google_fonts: ^9.0.0

  # Utils & Encoding
  intl: ^0.20.2
  uuid: ^4.0.0
  shared_preferences: ^2.2.2
  flutter_launcher_icons: ^0.14.4

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8

flutter_launcher_icons:
  image_path: "assets/logo/main.png"
  windows:
    generate: true
    image_path: "assets/logo/main.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo/main.png"
  linux:
    generate: true
    image_path: "assets/logo/main.png"


flutter:

  uses-material-design: true

  assets:
    - assets/logo/
    - assets/logo/main.png
    - assets/logo/segma.png


