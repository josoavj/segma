services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    container_name: segma-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Cache HuggingFace (persistant entre redémarrages)
      - hf_cache:/root/.cache/huggingface
      # Données backend persistantes
      - uploads_data:/app/data/uploads
      - masks_data:/app/data/masks
      # Configuration optionnelle
      - ./backend/config.py:/app/config.py:ro
    environment:
      # Configuration GPU NVIDIA (par défaut)
      - DEVICE=${DEVICE:-cuda}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Configuration application
      - MAX_FILE_SIZE=104857600
      - UPLOAD_DIR=/app/data/uploads
      - OUTPUT_DIR=/app/data/masks
      # Logging
      - LOG_LEVEL=info
    gpus: all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v3/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Limites de ressources (optionnel)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 8G
    #     reservations:
    #       cpus: '1'
    #       memory: 4G

  backend-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    container_name: segma-backend-cpu
    profiles: ["cpu"]
    ports:
      - "${BACKEND_CPU_PORT:-8001}:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - uploads_data:/app/data/uploads
      - masks_data:/app/data/masks
      - ./backend/config.py:/app/config.py:ro
    environment:
      - DEVICE=cpu
      - CUDA_VISIBLE_DEVICES=
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MAX_FILE_SIZE=104857600
      - UPLOAD_DIR=/app/data/uploads
      - OUTPUT_DIR=/app/data/masks
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v3/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Service optionnel: Nginx reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - backend

# Volumes nommés pour persistance
volumes:
  hf_cache:
    driver: local
  uploads_data:
    driver: local
  masks_data:
    driver: local

# Network personnalisé (optionnel)
networks:
  default:
    name: segma-network
    driver: bridge
